[main]
font = TvirMono Nerd Font:size=12
font-size-adjustment = 1
line-height = 15
underline-offset = 1
term = foot-direct
selection-target = both
include = /usr/share/foot/themes/nord
dpi-aware = true
pad = 5x5 center
initial-window-mode = maximized

[scrollback]
lines = 50000

[csd]
preferred = none
