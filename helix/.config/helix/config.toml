theme = "nord"

[editor]
auto-pairs = false
color-modes = true
cursorline = true
default-yank-register = "+"
popup-border = "all"
rulers = [80, 100]
true-color = true

[editor.inline-diagnostics]
cursor-line = "hint"

[editor.cursor-shape]
normal = "block"
insert = "bar"
select = "block"

[editor.file-picker]
hidden = false

[editor.indent-guides]
render = true

[editor.statusline]
left = [
  "mode",
  "file-name",
]
right = [
  "spinner",
  "diagnostics",
  "spacer",
  "file-encoding",
  "file-line-ending",
  "file-type",
  "spacer",
  "position-percentage",
  "position",
]

[editor.whitespace.render]
space = "all"
tab = "all"
newline = "none"

[keys.normal]
"ret" = ["move_line_down", "goto_first_nonwhitespace"]

[keys.normal.space]
i = ":toggle lsp.display-inlay-hints"
